# ============================================================
#  Jack's Blog 站点配置
#  想改站点信息 / 文案 / 友链 / 页脚 / 导航 / 照片墙，直接改这个文件即可。
#  改完 push 到 main，GitHub Actions 会自动部署，几分钟后生效。
# ============================================================

site:
  title: "Jack's Blog"
  description: "记录技术实践、学习过程，以及对一些长期问题的思考。"
  numPostsOnHomepage: 6        # 首页显示文章数
  numPostsPerPage: 24          # 「全部文章」每页条数

# 顶部导航栏
nav:
