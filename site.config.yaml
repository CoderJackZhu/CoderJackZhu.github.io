    eyebrow: "All writing"
    heading: "全部文章"
    sectionHeading: "文章"
    postsLabel: "posts"
  about:
    title: "关于"
    eyebrow: "About this site"
    heading: "关于"
    subtitle: "这是我的个人介绍。"
  link:
    title: "友链"
    eyebrow: "Friends"
    heading: "友链"
  photos:
    title: "照片"
    eyebrow: "Photos"
    heading: "照片"
